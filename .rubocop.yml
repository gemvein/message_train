inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  DisplayCopNames: true
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - message_train.gemspec
    - db/migrate/*
    - spec/dummy/db/schema.rb
    - spec/dummy/db/migrate/*

Metrics/BlockLength:
  Exclude:
    - config/routes.rb
    - spec/*
    - spec/*/*
    - spec/*/*/*
    - spec/dummy/db/seeds/*

Metrics/ModuleLength:
  Exclude:
    - spec/*
    - spec/*/*
    - spec/*/*/*
