name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']
    env:
      RAILS_ENV: test
      TZ: America/Denver
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Set up test database
        run: bundle exec rails db:create db:schema:load
        working-directory: spec/dummy
      # Cuprite drives a real Puma server over HTTP, so it needs the
      # compiled CSS on disk - Propshaft doesn't compile Sass on the
      # fly, and dartsass-rails only does so via this explicit task.
      - name: Build CSS assets
        run: bundle exec rails dartsass:build
        working-directory: spec/dummy
      # Run non-JS and JS (Cuprite) specs as separate rspec processes.
      # Cuprite drives the app on a real server thread with its own DB
      # connection, so writes it makes through the browser commit
      # immediately and can't be rolled back the way DatabaseCleaner's
      # transaction strategy rolls back everything else - running both
      # kinds of spec in one process lets that leak across into unrelated
      # model/helper/controller examples.
      - run: bundle exec rspec --exclude-pattern "spec/features/**/*_spec.rb"
      - run: bundle exec rspec spec/features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ruby-${{ matrix.ruby }}
          path: coverage/
      # Publishes a self-hosted coverage badge (badges/coverage.json, read by
      # a shields.io endpoint badge in the README) instead of depending on a
      # third-party coverage service like Coveralls/Codecov. Computed inline
      # (not via a separate job downloading the artifact above) since
      # actions/upload-artifact silently drops SimpleCov's dotfile output
      # (.last_run.json) - staying in the same job/workspace where the
      # coverage/ directory rspec just wrote is guaranteed to still exist
      # sidesteps that entirely. Gated to one matrix leg so only one commit
      # happens per run.
      #
      # `covered_percent` vs `line`: this repo runs rspec twice (non-feature
      # + feature specs as separate processes, see above) and SimpleCov
      # merges the two runs' coverage - the merged .last_run.json uses a
      # different key (`line`) than a single-run result (`covered_percent`,
      # what gem_template's single `bundle exec rspec` produces). Handle
      # both rather than assume one.
      - name: Update coverage badge
        if: matrix.ruby == '4.0' && github.ref_name == github.event.repository.default_branch && github.event_name == 'push'
        run: |
          pct=$(ruby -rjson -e "r = JSON.parse(File.read('coverage/.last_run.json'))['result']; puts (r['covered_percent'] || r['line']).round(1)")
          color=$(ruby -e "pct = $pct; puts(pct >= 90 ? 'brightgreen' : pct >= 75 ? 'yellow' : 'red')")
          mkdir -p badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > badges/coverage.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
          git push
